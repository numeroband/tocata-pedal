[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytocatapedal"
version = "0.1.0"
description = "Python port of the Tocata Pedal MIDI SysEx API and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
quad-cortex = [
    "pyquadcortex",
    "hidapi",
]

[project.scripts]
pytocatapedal = "pytocatapedal.cli:main"
pytocatapedal-qc-bridge = "pytocatapedal.qc_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]
